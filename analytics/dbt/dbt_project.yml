name: alpha_lakehouse_dbt
version: "1.0.0"
config-version: 2

profile: alpha_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  env_raw: "raw"
  env_standardize: "standardize"
  env_curated: "curated"
  universe_top_n: 3000
  universe_adv_window_days: 63
  filing_lag_days: 34

seeds:
