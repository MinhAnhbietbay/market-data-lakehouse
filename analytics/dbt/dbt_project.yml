      +schema: curated_pit_test
      pit_seed_quarterly_metric:
        +column_types:
          symbol: string
          period_end_date: date
          known_from: date
          metric_value: double
      pit_seed_spine:
        +column_types:
          date: date
          symbol: string
      pit_seed_price_bar:
        +column_types:
          symbol: string
          trade_date: date
          open: double
          high: double
          low: double
          close: double
          volume: double
          known_from: date
          source_run_date: date
      pit_seed_stock_split:
        +column_types:
          symbol: string
          split_effective_date: date
          numerator: double
          denominator: double
      pit_seed_cash_dividend:
