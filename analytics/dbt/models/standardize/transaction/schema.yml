version: 2

models:
  - name: std_tx_daily_price_bar
    description: >
      Daily Price Bar (tx area), daily_fact -- cột open/high/low/close/volume
      của một mã trong một phiên, nguồn /historical-price-eod/non-split-adjusted.
      Đây là giá THÔ CHƯA điều chỉnh split lẫn cổ tức -- FMP đặt tên field trả
      về là adjOpen/adjHigh/adjLow/adjClose một cách gây hiểu nhầm (tiêu đề docs
      FMP là "Unadjusted Stock Price"); raw đã đổi tên cột thành
      open/high/low/close để không lặp lại tên gây hiểu nhầm đó lên tầng này
      (F12, spec 2026-08-18-intermediate-identity-spine-design.md §3). Giá đã
      chuẩn hoá theo split/cổ tức (adj_close đúng nghĩa, vwap) tính ở curated từ
      cột thô này cộng /splits + /dividends (D1). PK (symbol, trade_date),
      grain được ép bởi test dbt_utils.unique_combination_of_columns trên
      (symbol, trade_date) (dedupe cấu trúc đúng nhờ row_number()). See
      docs/superpowers/specs/2026-08-14-intermediate-tx-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, trade_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: trade_date
        data_tests: [not_null]
      - name: known_from
        description: >
          Ngày sớm nhất một backtest được phép nhìn thấy dòng này -- thanh giá
          biết được lúc đóng cửa phiên đó (= trade_date). D14 (làm tròn ngày giao
          dịch) không áp dụng ở đây — known_from LÀ trade_date, tự nó đã luôn là
          một ngày giao dịch; join vào bảng tra sẽ là no-op theo cấu trúc.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_tx_market_cap_observation
    description: >
      Market Cap Observation (tx area), daily_fact -- vốn hoá thị trường
      ĐÃ LƯU do FMP quan sát tại một ngày, khác với vốn hoá tự tính
      (measure ở curated về sau). PK (symbol, trade_date), không test unique
      composite (cùng lý do std_tx_daily_price_bar). See
      docs/superpowers/specs/2026-08-14-intermediate-tx-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, trade_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: trade_date
        data_tests: [not_null]
      - name: known_from
        description: >
          Ngày sớm nhất một backtest được phép nhìn thấy dòng này. D14 (làm tròn
          ngày giao dịch) không áp dụng ở đây — known_from LÀ trade_date, tự nó
          đã luôn là một ngày giao dịch; join vào bảng tra sẽ là no-op theo cấu
          trúc.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_tx_insider_transaction_type
    description: >
      Insider Transaction Type dimension (tx area) -- degenerate lookup,
      one row per distinct transaction type code. This is one of 3
      physical tables built from the single vocab concept "Insider
      Transaction" (spec D1) -- this one is the reference/dimension half,
      not the event data itself. See
      docs/superpowers/specs/2026-08-14-intermediate-tx-slice-design.md §4.
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: transaction_type
        description: PK.
        data_tests: [not_null, unique]
  - name: std_tx_insider_activity_summary
    description: >
      Insider Transaction (tx area), period_fact -- tổng hợp số liệu mua/
      bán insider theo (symbol, cik, quý). Đây là 1 trong 3 bảng vật lý
      tách từ 1 concept vocab "Insider Transaction" (spec D1) -- bảng này
      là nửa period_fact (tổng hợp), khác grain với std_tx_insider_transaction
      (event, rỗng). fiscal_year/fiscal_quarter denormalized raw, chưa FK
      sang Fiscal Period (area ac, chưa xây -- nợ N-11). **ĐÃ BIẾT BỊ CHẶN**:
      dbt build sẽ fail (TrinoUserError TABLE_NOT_FOUND) cho tới khi
      raw_fmp_insider_statistics có data thật trong Iceberg -- source
      endpoint bị chặn bởi gói FMP hiện tại, đã live-verify 2026-08-14,
      chấp nhận như một giới hạn đã biết (cùng loại với
      std_ip_workforce_observation, xem staging-regen-scoped memory). See
      docs/superpowers/specs/2026-08-14-intermediate-tx-slice-design.md §4.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    # known_from sẽ vào khoá khi bảng có dữ liệu và ta biết pit_basis của nguồn.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, cik, fiscal_year, fiscal_quarter, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: cik
        description: FK to std_ip_legal_entity.cik.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ip_legal_entity')
              field: cik
      - name: fiscal_year
        data_tests: [not_null]
      - name: fiscal_quarter
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_tx_insider_transaction
    description: >
      Insider Transaction (tx area), event -- EMPTY BY DESIGN. Source
      endpoint /insider-trading/search has no raw contract
      (paid_required, blocked on FMP tier upgrade, N-12). This is the
      event-grain half of the 3-table split from spec D1 (the other 2,
      std_tx_insider_transaction_type and std_tx_insider_activity_summary,
      have real data). Does not carry person_name (std_ip_corporate_insider
      owns that, spec D6); company_cik has no relationships test (spec D7).
      See docs/superpowers/specs/2026-08-14-intermediate-tx-slice-design.md §4.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    # known_from sẽ vào khoá khi bảng có dữ liệu và ta biết pit_basis của nguồn.
    # Khoá này có thể KHÔNG đủ phân biệt trên dữ liệu Form 4 thật: một insider
    # có thể có nhiều giao dịch cùng loại, cùng mã, cùng ngày, khác giá/khối
    # lượng. Giữ nguyên vì thêm cột là đoán dữ liệu chưa thấy. Phải đo trùng
    # lặp TRƯỚC khi endpoint mở khoá (nợ N-i, spec 3b §2.2).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [reporting_cik, symbol, transaction_date, transaction_type, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: transaction_type
        description: FK to std_tx_insider_transaction_type.transaction_type.
        data_tests:
          - relationships:
              to: ref('std_tx_insider_transaction_type')
              field: transaction_type
      - name: reporting_cik
        description: >
          FK to std_ip_corporate_insider.reporting_cik (both tables empty
          today -- test passes vacuously until real data lands in both).
        data_tests:
          - relationships:
              to: ref('std_ip_corporate_insider')
              field: reporting_cik
      - name: company_cik
        description: >
          CIK của công ty. FK tới std_ip_legal_entity là KIỂM TỒN TẠI, không
          phải khoá đầy đủ -- PK của bảng đó là (cik, valid_from, known_from).
          Join theo thời gian phải dùng macro resolve_entity_at (xem Task 24).
        data_tests:
          - relationships:
              to: ref('std_ip_legal_entity')
              field: cik
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values:
              values: ['filing', 'observation']
