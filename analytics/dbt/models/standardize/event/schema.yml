          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_ev_merger_acquisition
    description: >
      Merger Acquisition (ev area), event -- một pháp nhân thâu tóm hoặc
      sáp nhập với pháp nhân khác. PK 5 cột (symbol, cik, targeted_cik,
      targeted_symbol, announcement_date) -- rộng nhất trong tầng
      standardize tới nay. symbol/cik là bên mua (FK thật); targeted_cik/
      targeted_symbol là bên bị mua, KHÔNG FK -- có thể là công ty tư
      nhân ngoài universe (spec D1). accepted_date/filing_url (field SEC
      Filing) denormalize raw trực tiếp trên bảng này, không dựng bảng
      SEC Filing riêng (spec D2, giữ nguyên quyết định D1 slice bd/do/pr).
      See docs/superpowers/specs/2026-08-17-intermediate-ev-slice-design.md §4.
      KNOWN BLOCKED: will fail to build (TrinoUserError TABLE_NOT_FOUND) until
      raw_fmp_mergers_acquisitions lands in Iceberg -- source endpoint switched
      from /mergers-acquisitions-latest to /mergers-acquisitions-search (F7/F7b,
      spec 2026-08-18-intermediate-identity-spine-design.md §3), which is itself
      now confirmed HTTP 402 on the current FMP tier -- do not treat this as a
      bug in this model's SQL. Accepted per R-a, 0 rows until plan upgrade.
      Originally live-verified 2026-08-17 (spec N-27).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            [symbol, cik, announcement_date, targeted_party_key, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol (bên mua).
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: cik
        description: FK to std_ip_legal_entity.cik (bên mua).
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ip_legal_entity')
              field: cik
      - name: targeted_cik
        description: >
          Bên bị mua -- KHÔNG FK, có thể là công ty tư nhân ngoài universe
          (spec D1, N-25).
      - name: targeted_symbol
        description: >
          Bên bị mua -- KHÔNG FK, có thể null khi mục tiêu là công ty tư
          nhân (spec D1, N-25).
      - name: targeted_party_key
        description: >
          Định danh bên bị mua, dùng làm một phần khoá. coalesce(targeted_cik,
          targeted_symbol, '__UNKNOWN__') -- hai cột gốc đều nullable
          by construction (bên bị mua có thể là công ty tư nhân ngoài
          universe), nên khoá cũ 5 cột chứa cột nullable không có not_null nào.
        data_tests: [not_null]
      - name: announcement_date
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_ev_earnings_announcement
    description: >
