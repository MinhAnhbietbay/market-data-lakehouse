      doanh một kỳ. PK (symbol, announcement_date). KHÔNG FK sang bất kỳ
      bảng ac nào -- /earnings không có fiscal_year/period, không có khóa
      chung để nối (spec D4); vai trò "known_from_date chuẩn nhất cho
      Income Statement" trong vocab mang tính ý nghĩa nghiệp vụ, không
      phải ràng buộc FK. See
      docs/superpowers/specs/2026-08-17-intermediate-ev-slice-design.md §4.
      UPDATE (2026-08-20, Task 10): raw_fmp_earnings now exists in Iceberg with
      real data (625 rows measured) -- the KNOWN BLOCKED note below is stale as
      of the staging-full-fidelity rebuild and no longer describes the current
      state. Original note (2026-08-17, spec N-27), kept for history: will fail
      to build (TrinoUserError TABLE_NOT_FOUND) until stg_fmp_earnings lands in
      Iceberg -- source endpoint (/earnings) has availability: unknown in
      configs/sources/data_sources.yaml, not a confirmed paid_required
      restriction -- do not treat this as a bug in this model's SQL. Accepted
      limitation, live-verified 2026-08-17 (spec N-27).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, announcement_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: announcement_date
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_ev_symbol_change_event
    description: >
      Symbol Change (ev area), event -- một mã giao dịch được đổi tên. Đây là
      một trong hai nguồn đóng/mở phiên bản của std_ar_listing.
      BẢNG RỖNG (chờ nâng gói FMP, endpoint symbol-change trả 402). Test khoá
      và FK dưới đây xanh vô điều kiện và CHƯA CHỨNG MINH ĐƯỢC GÌ. Chúng ở
      đây để ngày có dữ liệu thật thì grain và quan hệ đã khai sẵn, sai lệch
      đỏ ngay lần build đầu tiên thay vì lọt vào curated.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [old_symbol, new_symbol, change_date, known_from]
    columns:
      - name: old_symbol
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: new_symbol
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: change_date
        data_tests: [not_null]
      - name: known_from
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values:
              values: ['filing', 'observation']
  - name: std_ev_ipo_event
    description: >
      IPO Event (ev area) -- EMPTY BY DESIGN. Cả 2 endpoint nguồn
      (/ipos-calendar, /ipos-disclosure) đều chưa có raw contract
      (paid_required, blocked on FMP tier upgrade). Không mang field SEC
      Filing của /ipos-disclosure (filing_date/accepted_date/form/
      filing_url) -- đúng mẫu 5 bảng rỗng tiền lệ chỉ mang cột của chính
      concept. Spec §2/D5, N-24.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    # known_from sẽ vào khoá khi bảng có dữ liệu và ta biết pit_basis của nguồn.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, effectiveness_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol (dự kiến, không kiểm chứng được).
      - name: effectiveness_date
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values:
              values: ['filing', 'observation']
  - name: std_ev_economic_data_release
    description: >
      Economic Data Release (ev area) -- EMPTY BY DESIGN. Source endpoint
      /economic-calendar has no raw contract (paid_required, blocked
      on FMP tier upgrade). KHÔNG có cột symbol -- event vĩ mô toàn thị
      trường, không gắn với 1 công ty cụ thể (spec D3, giống
      std_cm_macro_observation). country_code/currency_code CÓ FK sang
      std_lo_country/std_cm_currency (xem cột bên dưới) -- spec D5 gốc
      (2026-08-17-intermediate-ev-slice-design.md) từng chủ trương không FK,
      nhưng đã lỗi thời: cả hai bảng đích đều tồn tại và ổn định, FK ở đây
      không tốn gì (bảng rỗng test luôn xanh) và sẽ được kiểm chứng thật khi
      FMP mở endpoint. Spec §2/D5, N-24.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    # known_from sẽ vào khoá khi bảng có dữ liệu và ta biết pit_basis của nguồn.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [event_key, country_code, release_date, known_from]
    columns:
      - name: release_date
      - name: country_code
        description: Quốc gia đăng ký. FK tới std_lo_country (nguồn seed ISO 3166).
        data_tests:
          - relationships:
              to: ref('std_lo_country')
              field: country_code
      - name: currency_code
        data_tests:
          - relationships:
              to: ref('std_cm_currency')
              field: currency_code
      - name: event_key
        description: event đã chuẩn hoá (upper+trim). PK thật sự của bảng.
      - name: event
      - name: previous
      - name: estimate
      - name: actual
      - name: impact
      - name: unit
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values:
              values: ['filing', 'observation']
