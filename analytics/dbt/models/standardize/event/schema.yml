version: 2

models:
  - name: std_ev_delisting_event
    description: >
      Delisting Event (ev area) -- one row per Listing that has delisted.
      Exists specifically so std_ar_listing.valid_to has a real business
      date to join against (rule N3: never infer listing status from a flag).
      See spec docs/superpowers/specs/2026-08-12-intermediate-ip-ar-slice-design.md §6.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, delisted_date, known_from]
    columns:
      - name: symbol
        description: >
          FK to std_ar_listing.symbol -- NOT enforced as a hard relationships
          test here. 21 delisting events (measured 2026-08-19) belong to
          symbols that never resolved a share_class_figi and so never made
          it into std_ar_listing; those events are real data we keep, not a
          bug to delete. Guarded instead by
          tests/assert_delisting_event_orphan_count.sql, a threshold test in
          the same style as assert_unresolved_share_class_figi_count.sql.
        # unique(symbol) đã BỎ 2026-08-22: đây là bom hẹn giờ y hệt cái đã gỡ ở
        # std_ar_listing. Một ticker bị huỷ niêm yết rồi được sàn cấp lại cho công
        # ty khác sẽ có HAI sự kiện huỷ hợp lệ. Khoá đúng là (symbol, delisted_date,
        # known_from), khai ở mục data_tests của model.
        data_tests:
          - not_null
      - name: delisted_date
        description: event_date -- the date the Listing stopped trading.
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: >
          Transaction time: ta biết được giá trị này từ ngày nào. Nguồn không có
          ngày công bố nên đây là run_date của lần raw ĐẦU TIÊN nhìn thấy đúng
          tập thuộc tính này. Truy vấn as-of ngày d chỉ đọc dòng known_from <= d.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        description: >
          'observation' -- best-effort, không phải PIT thật. Backtest phải phân
          biệt được hai loại này, nếu trộn thì không ai phát hiện.
        data_tests:
          - not_null
          - accepted_values: {values: ['observation']}
  - name: std_ev_stock_split
    description: >
      Stock Split (ev area), event -- chia tách/gộp cổ phiếu tại một
