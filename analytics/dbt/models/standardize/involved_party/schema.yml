version: 2

models:
  - name: std_ip_legal_entity
    description: >
      Legal Entity dimension (ip area), SCD2 derived from raw run_date partitions -- pháp nhân
      phát hành chứng khoán, định danh bền vững bằng cik. isin/cusip/
      open_figi_composite/security_type/is_etf/is_adr/is_fund moved to
      std_pd_security (pd slice, 2026-08-14) -- those columns have symbol
      grain, not cik grain, and were being silently dedupe'd wrong for
      multi-share-class issuers before this fix. Denormalizes remaining
      reference-only fields belonging to out-of-slice concepts (Currency/
      Sector/Industry Classification System) per spec D6/N-6/N-8.
      valid_from/valid_to are OBSERVATION dates (derived from the raw
      run_date partition series when this exact attribute combination was
      first observed) -- NOT
      business dates, unlike std_ar_listing's valid_from/valid_to which ARE
      business dates (ipo_date/delisted_date). See
      docs/superpowers/specs/2026-08-14-intermediate-pd-slice-design.md §5
      for the removal, spec §5 of the 2026-08-12 spec for the SCD2 mechanism.
      Closes the currency/industry/sector/sic_code FK debt (N-6/N-8/N-9) via
      docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §5.
      Industry/sector FK tests unable to live-verify (target tables blocked on
      FMP tier). currency_code/price_currency/sic_code tests ran green live
      (2026-08-14), but their targets (std_cm_currency,
      std_cm_industry_classification_system) are bootstrap tables derived
      from these same columns -- the tests are structurally incapable of
      failing until a real reference source lands (spec N-14). industry/sector
      are the only two of the five with any chance of catching real drift, and
      both are currently blocked on FMP tier (see above).
      FK từ các bảng khác trỏ vào cột cik là KIỂM TỒN TẠI, không phải khoá đầy
      đủ (PK là cik + valid_from + known_from). Mọi join theo thời gian PHẢI
      dùng macro resolve_entity_at; join trần theo cik nhân bản dòng theo số
      phiên bản.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cik, valid_from, known_from]
    columns:
      - name: cik
        description: PK, denormalized from Identifier Scheme.
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
      - name: currency_code
        description: FK to std_cm_currency.currency_code.
        data_tests:
          - relationships:
              to: ref('std_cm_currency')
              field: currency_code
      - name: country_code
        description: FK to std_lo_country.country_code.
        data_tests:
          - relationships:
              to: ref('std_lo_country')
              field: country_code
      - name: industry_key
        description: >
          FK to std_gr_industry.industry_key -- NOT enforced as a hard relationships test.
          std_gr_industry is EMPTY (0 dòng, đo 2026-08-20) vì endpoint FMP của nó trả 402,
          nên FK cứng bất khả thi VỀ CẤU TRÚC với mọi giá trị non-null, không phải
          chỉ là đang đỏ. Guard bằng ngưỡng thay thế:
          tests/assert_legal_entity_industry_orphan_count.sql (trần 6, đo 2026-08-20).
          Khi nâng gói FMP và std_gr_industry có dữ liệu, con số phải về 0 và FK cứng quay lại.
      - name: industry
        description: >
          FK to std_gr_industry.industry -- NOT enforced as a hard relationships test.
          std_gr_industry is EMPTY (0 dòng, đo 2026-08-20) vì endpoint FMP của nó trả 402,
          nên FK cứng bất khả thi VỀ CẤU TRÚC với mọi giá trị non-null, không phải
          chỉ là đang đỏ. Guard bằng ngưỡng thay thế:
          tests/assert_legal_entity_industry_orphan_count.sql (trần 6, đo 2026-08-20).
          Khi nâng gói FMP và std_gr_industry có dữ liệu, con số phải về 0 và FK cứng quay lại.
      - name: sector_key
        description: >
          FK to std_gr_sector.sector_key -- NOT enforced as a hard relationships test.
          std_gr_sector is EMPTY (0 dòng, đo 2026-08-20) vì endpoint FMP của nó trả 402,
          nên FK cứng bất khả thi VỀ CẤU TRÚC với mọi giá trị non-null, không phải
          chỉ là đang đỏ. Guard bằng ngưỡng thay thế:
          tests/assert_legal_entity_sector_orphan_count.sql (trần 6, đo 2026-08-20).
          Khi nâng gói FMP và std_gr_sector có dữ liệu, con số phải về 0 và FK cứng quay lại.
      - name: sector
        description: >
          FK to std_gr_sector.sector -- NOT enforced as a hard relationships test.
          std_gr_sector is EMPTY (0 dòng, đo 2026-08-20) vì endpoint FMP của nó trả 402,
          nên FK cứng bất khả thi VỀ CẤU TRÚC với mọi giá trị non-null, không phải
          chỉ là đang đỏ. Guard bằng ngưỡng thay thế:
          tests/assert_legal_entity_sector_orphan_count.sql (trần 6, đo 2026-08-20).
          Khi nâng gói FMP và std_gr_sector có dữ liệu, con số phải về 0 và FK cứng quay lại.
      - name: sic_code
        description: FK to std_cm_industry_classification_system.sic_code.
        data_tests:
          - relationships:
              to: ref('std_cm_industry_classification_system')
              field: sic_code
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time', 'assumed_since_ipo']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values:
              values: ['filing', 'observation']
  - name: std_ip_research_firm
    description: >
      Research Firm dimension (ip area) -- degenerate 1-column lookup.
      /grades gives no attribute about the firm beyond its name.
      FK từ std_bd_analyst_grade_action.grading_company_key tới bảng này là
      TAUTOLOGICAL: cả hai đầu lấy từ cùng một cột raw_fmp_grades.grading_company,
      nên test KHÔNG THỂ FAIL. Nó ở đây để khai quan hệ, không phải để kiểm
      chứng. Ngày có nguồn danh mục hãng nghiên cứu độc lập thì nó mới có nghĩa.
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: research_firm_name_key
        description: research_firm_name đã chuẩn hoá (upper+trim). PK thật sự của bảng.
        data_tests: [not_null, unique]
      - name: research_firm_name
        description: PK.
        data_tests: [not_null, unique]
  - name: std_ip_workforce_observation
    description: >
      Workforce Observation (ip area), period_fact -- full-time employee
      count per Legal Entity per SEC filing period. known_from_date
      (filing_date/accepted_date) is denormalized per spec D6 (SEC Filing
      is not a separate table in this slice). KNOWN BLOCKED: will fail to
      build (TrinoUserError TABLE_NOT_FOUND) until raw_fmp_employee_count
      lands in Iceberg -- source endpoint blocked on current FMP subscription
      tier, accepted limitation, see staging-regen-scoped memory.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cik, period_end_date, known_from]
    columns:
      - name: cik
        description: FK to std_ip_legal_entity.cik.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ip_legal_entity')
              field: cik
      - name: period_end_date
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_ip_corporate_insider
    description: >
      Corporate Insider dimension (ip area) -- EMPTY BY DESIGN. Source
      endpoint /insider-trading/search has no raw contract (paid_required,
      blocked on FMP tier upgrade). Schema ready for when data lands. Spec §2/D5.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    columns:
      - name: reporting_cik
        description: PK (denormalized).
        data_tests: [not_null, unique]
      - name: person_name
  - name: std_ip_beneficial_owner
    description: >
      Beneficial Owner dimension (ip area) -- EMPTY BY DESIGN. Source
      endpoint /acquisition-of-beneficial-ownership has no raw contract
      (paid_required, blocked on FMP tier upgrade). Spec §2/D5.
    # BẢNG RỖNG (chờ nâng gói FMP). Test khoá dưới đây XANH VÔ ĐIỀU KIỆN và CHƯA
    # CHỨNG MINH ĐƯỢC GÌ. Nó ở đây để ngày có dữ liệu thật thì grain đã được khai
    # sẵn và sai lệch đỏ ngay lần build đầu tiên, thay vì lọt vào curated.
    columns:
      - name: name_of_reporting_person
        description: >
          PK -- degenerate, no CIK given for the owner in this response shape.
          Khoá **suy biến**: nguồn không trả CIK cho nhóm này, nên khoá là một cái tên tự do.
          Tên trùng nhau giữa hai người thật sẽ gộp nhầm và test này **không bắt được**.
          Phải đổi khoá khi nguồn có định danh thật.
        data_tests: [not_null, unique]
      - name: citizenship_or_place_of_organization
      - name: type_of_reporting_person
