version: 2

models:
  - name: std_cm_currency
    description: >
      Currency dimension (cm area) -- Nguồn là seed tĩnh (Task 3) chứ không
      phải suy ngược từ std_ip_legal_entity — nhờ vậy FK trỏ tới bảng này
      thật sự kiểm chứng được.
      See docs/superpowers/specs/2026-08-22-intermediate-layer-closure-design.md §3.0.2 (C6).
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Nguồn
    # tham chiếu thật đã có (seed tĩnh), việc bảng này có cần chuyển sang hình
    # dạng có phiên bản như nhóm observation hay không vẫn là câu hỏi mở.
    columns:
      - name: currency_code
        description: PK. Mã tiền tệ ISO 4217 (3 chữ cái).
        data_tests: [not_null, unique]
      - name: currency_name
        description: Tên tiền tệ.
        data_tests: [not_null]
      - name: minor_unit
        description: Số chữ số thập phân nhỏ nhất theo chuẩn ISO 4217.
        data_tests: [not_null]
  - name: std_cm_industry_classification_system
    description: >
      Industry Classification System dimension (cm area) -- Nguồn là seed
      tĩnh (Task 3) chứ không phải suy ngược từ std_ip_legal_entity — nhờ
      vậy FK trỏ tới bảng này thật sự kiểm chứng được.
      See docs/superpowers/specs/2026-08-22-intermediate-layer-closure-design.md §3.0.2 (C6).
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Nguồn
    # tham chiếu thật đã có (seed tĩnh), việc bảng này có cần chuyển sang hình
    # dạng có phiên bản như nhóm observation hay không vẫn là câu hỏi mở.
    columns:
      - name: sic_code
        description: PK. Mã phân ngành chuẩn SIC (4 chữ số).
        data_tests: [not_null, unique]
      - name: sic_description
        description: Mô tả ngành kinh doanh theo phân loại SIC.
        data_tests: [not_null]
      - name: sic_group
        description: Nhóm phân ngành lớn (Division) theo phân loại SIC.
        data_tests: [not_null]
  - name: std_cm_macro_series
    description: >
      Macro Series dimension (cm area) -- degenerate lookup, one row per
      distinct macro indicator series name. F10a (spec 2026-08-18) gộp 3
      raw table cũ (CPI, Federal Funds, GDP -- mỗi cái một endpoint
      market_wide riêng) thành một raw_fmp_economic_indicators (endpoint
      economic_indicators, scope macro_series, 12 series trong
      runtime_sets.fmp_macro_series); model này đọc thẳng một source, không
      còn union. Only 1 column: no endpoint gives unit/publishing-agency
      attributes the vocab's own concept description mentions (spec N-16).
      See docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4
      và docs/superpowers/specs/2026-08-18-intermediate-identity-spine-design.md §3 (F10a).
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: series_name
        description: PK.
        data_tests: [not_null, unique]
  - name: std_cm_macro_observation
    description: >
      Macro Observation (cm area, narrow half), series grain -- one row
      per (series_name, observation_date), đọc từ raw_fmp_economic_indicators
      (F10a, spec 2026-08-18 -- xem std_cm_macro_series ở trên, không còn
      union 3 nguồn cũ). This is 1 of 2 physical tables split from the
      vocab's single "Macro Observation" concept (spec D3) -- the other
      half, std_cm_treasury_rate, has an incompatible wide shape and is NOT
      unioned here. PK (series_name, observation_date) -- no composite
      unique test (no dbt_utils, same precedent as every prior slice). See
      docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_name, observation_date, known_from]
    columns:
      - name: series_name
        description: FK to std_cm_macro_series.series_name.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_cm_macro_series')
              field: series_name
      - name: observation_date
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: >
          Transaction time: ta biết được giá trị này từ ngày nào. Nguồn không có
          ngày công bố nên đây là run_date của lần raw ĐẦU TIÊN nhìn thấy đúng
          tập thuộc tính này. Truy vấn as-of ngày d chỉ đọc dòng known_from <= d.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        description: >
          'observation' -- best-effort, không phải PIT thật. Backtest phải phân
          biệt được hai loại này, nếu trộn thì không ai phát hiện.
        data_tests:
          - not_null
          - accepted_values: {values: ['observation']}
  - name: std_cm_treasury_rate
    description: >
      Macro Observation (cm area, long half), daily_fact -- một dòng mỗi
      (observation_date, tenor), dạng long. Xoay từ 12 cột kỳ hạn
      (month_1..year_30) sang (tenor, rate). This is the 2nd of 2 physical
      tables split from the vocab's single "Macro Observation" concept
      (spec D3) -- deliberately NOT unioned with std_cm_macro_observation
      (incompatible wide vs narrow shape). No symbol/series FK -- this
      table is self-contained by observation_date.
      See docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4
      và docs/superpowers/specs/2026-08-22-intermediate-layer-closure-design.md §6.1.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [observation_date, tenor, known_from]
    columns:
      - name: observation_date
        data_tests: [not_null]
      - name: tenor
        description: >
          Kỳ hạn trái phiếu ('month_1'..'year_30'). Trước đây là 12 tên cột --
          dữ liệu bị mã hoá thành lược đồ. Thêm kỳ hạn mới giờ là thêm một dòng,
          không phải đổi lược đồ và mọi downstream.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - month_1
                - month_2
                - month_3
                - month_6
                - year_1
                - year_2
                - year_3
                - year_5
                - year_7
                - year_10
                - year_20
                - year_30
      - name: rate
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_cm_trading_day
    description: >
      Trading Day dimension (cm area) -- bootstrap, distinct trade dates
      observed in std_tx_daily_price_bar. The vocab's own concept
      description declares no_source: true and explicitly says this is
      derived downstream from Daily Price Bar (spec D2) -- not a real
      market calendar, just the set of dates FMP actually returned data
      for. See docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4.
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: trade_date
        description: PK.
        data_tests: [not_null, unique]
  - name: std_cm_next_trading_day
    description: >
      Bảng tra D14: mỗi ngày lịch -> ngày giao dịch kế tiếp (>= chính nó).
      Chỉ phủ khoảng [min(trade_date), max(trade_date)] của std_cm_trading_day.
      NGOÀI khoảng đó cố ý KHÔNG có dòng: một known_from muộn hơn ngày giao dịch
      cuối cùng ta biết thì không có ngày nào để làm tròn tới, và bịa ra một ngày
      giao dịch chưa tồn tại là tự tạo look-ahead. Model gọi phải dùng LEFT JOIN
      + coalesce về chính giá trị gốc. Xem Task 6 của plan bitemporal.
    columns:
      - name: calendar_date
        description: Ngày lịch bất kỳ trong khoảng phủ, kể cả cuối tuần và ngày nghỉ.
        data_tests: [not_null, unique]
      - name: next_trading_day
        description: Ngày giao dịch sớm nhất >= calendar_date.
        data_tests: [not_null]
