  - name: std_ac_revenue_segment_breakdown
    description: >
      Revenue Segment Breakdown (ac area), period_fact -- phân rã doanh
      thu theo khu vực địa lý ở dạng long-form (mỗi dòng một phân khúc:
      segment_name, segment_revenue). Không có FK cik (nguồn raw_fmp_revenue_
      geographic_segmentation không có cột cik -- spec D4). Chỉ có 1 phân
      khúc thật (americas, từ data_americas_segment) -- nguồn FMP thật trả
      về key động theo khu vực mỗi công ty, ingestion chỉ landed cứng 1 ví
      dụ, chưa model hoá đầy đủ (nợ N-19); dạng long không sửa nợ này, chỉ
      đổi hình dạng lưu trữ. Nguồn landed theo period: annual
      (configs/sources/data_sources.yaml:659), khác
      grain quarterly của 3 bảng income/balance/cash-flow statement --
      fiscal_year/period giữa 2 nhóm bảng KHÔNG so sánh trực tiếp được,
      join sẽ trả về gần như rỗng nếu không biết điều này. See
      docs/superpowers/specs/2026-08-14-intermediate-ac-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, fiscal_year, period, segment_name, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: fiscal_year
        data_tests: [not_null]
      - name: period
        data_tests: [not_null]
      - name: period_end_date
        data_tests: [not_null]
      - name: reported_currency
        description: Đơn vị tiền tệ của báo cáo. FK tới std_cm_currency (nguồn seed ISO 4217).
        data_tests:
          - relationships:
              to: ref('std_cm_currency')
              field: currency_code
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: >
          Transaction time: ta biết được giá trị này từ ngày nào. Nguồn không có
          ngày công bố nên đây là run_date của lần raw ĐẦU TIÊN nhìn thấy đúng
          tập thuộc tính này. Truy vấn as-of ngày d chỉ đọc dòng known_from <= d.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        description: >
          'filing' -- neo vào filing_date thật hoặc suy diễn từ nó. Mọi dòng của
          bảng này CHỈ mang 'filing' (macro gọi pit_basis='filing' không điều
          kiện) -- 'observation' không bao giờ xuất hiện, danh sách chấp nhận
          khớp đúng miền giá trị thật thay vì rộng hơn cần thiết.
        data_tests:
          - not_null
          - accepted_values: {values: ['filing']}

