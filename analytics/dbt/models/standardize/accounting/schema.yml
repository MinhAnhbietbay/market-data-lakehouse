version: 2

models:
  - name: std_ac_income_statement
    description: >
      Income Statement (ac area), period_fact -- báo cáo kết quả kinh
      doanh một kỳ. PK (symbol, fiscal_year, period), không test unique
      composite (không có dbt_utils, mẫu đã dùng ở slice pd/tx/gr/cm).
      Không có bảng Fiscal Period riêng (spec D1) -- fiscal_year/period
      denormalized trực tiếp. reported_currency/filing_date/accepted_date
      denormalized raw. See
      docs/superpowers/specs/2026-08-14-intermediate-ac-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, fiscal_year, period, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: cik
        description: FK to std_ip_legal_entity.cik.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ip_legal_entity')
              field: cik
      - name: fiscal_year
        data_tests: [not_null]
      - name: period
        data_tests: [not_null]
      - name: period_end_date
        data_tests: [not_null]
      - name: reported_currency
        description: Đơn vị tiền tệ của báo cáo. FK tới std_cm_currency (nguồn seed ISO 4217).
        data_tests:
          - relationships:
              to: ref('std_cm_currency')
              field: currency_code
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}

