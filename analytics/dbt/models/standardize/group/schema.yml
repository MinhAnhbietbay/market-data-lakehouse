version: 2

models:
  - name: std_gr_sector
    description: >
      Sector dimension (gr area) -- degenerate lookup, one row per distinct
      sector name from FMP's own reference list. No SCD2: sector names are
      static reference values. Consumed by std_ip_legal_entity.sector's FK
      (Task 10, closes spec pd slice's N-6/N-9 debt). See
      docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4.
      KNOWN BLOCKED: will fail to build (TrinoUserError TABLE_NOT_FOUND) until
      raw_fmp_available_sectors lands in Iceberg -- source endpoint blocked on
      current FMP subscription tier, accepted limitation, live-verified 2026-08-14.
      FK tới bảng này là TAUTOLOGICAL khi có dữ liệu vì cả hai đầu lấy từ cùng
      danh mục FMP, nên test KHÔNG THỂ FAIL.
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: sector_key
        description: sector đã chuẩn hoá (upper+trim). PK thật sự của bảng.
        data_tests: [not_null, unique]
      - name: sector
        description: PK.
        data_tests: [not_null, unique]
  - name: std_gr_industry
    description: >
      Industry dimension (gr area) -- degenerate lookup, one row per
      distinct industry name from FMP's own reference list. Consumed by
      std_ip_legal_entity.industry's FK (Task 10, closes N-6/N-9). See
      docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4.
      KNOWN BLOCKED: will fail to build (TrinoUserError TABLE_NOT_FOUND) until
      raw_fmp_available_industries lands in Iceberg -- source endpoint blocked on
      current FMP subscription tier, accepted limitation, live-verified 2026-08-14.
      FK tới bảng này là TAUTOLOGICAL khi có dữ liệu vì cả hai đầu lấy từ cùng
      danh mục FMP, nên test KHÔNG THỂ FAIL.
    # KHÔNG có known_from: đây là bảng tra cứu tĩnh (spec 2026-08-19 §4.2). Khi
    # nào có nguồn tham chiếu thật thay cho bootstrap hiện tại thì nó chuyển sang
    # hình dạng có phiên bản như nhóm observation.
    columns:
      - name: industry_key
        description: industry đã chuẩn hoá (upper+trim). PK thật sự của bảng.
        data_tests: [not_null, unique]
      - name: industry
        description: PK.
        data_tests: [not_null, unique]
  - name: std_gr_security_rating
    description: >
      Security Rating (gr area), daily_fact -- xếp hạng tổng hợp FMP tính
      cho một mã tại một ngày, kèm các điểm thành phần (7 điểm thành phần
      đã tách sang std_gr_security_rating_score dạng long). PK (symbol,
      rating_date), không test unique composite (không có dbt_utils, mẫu
      đã dùng ở slice pd/tx). See
      docs/superpowers/specs/2026-08-14-intermediate-gr-cm-slice-design.md §4
      và docs/superpowers/specs/2026-08-22-intermediate-layer-closure-design.md §6.1.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, rating_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: rating_date
        data_tests: [not_null]
      - name: rating
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
  - name: std_gr_security_rating_score
    description: >
      Security Rating Score (gr area), observation -- 7 điểm thành phần của
      xếp hạng, dạng long. Tách khỏi std_gr_security_rating (giữ hạng vô hướng).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, rating_date, score_name, known_from]
    columns:
      - name: symbol
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: rating_date
        data_tests: [not_null]
      - name: score_name
        data_tests:
          - not_null
          - accepted_values:
              values:
                - overall_score
                - discounted_cash_flow_score
                - return_on_equity_score
                - return_on_assets_score
                - debt_to_equity_score
                - price_to_earnings_score
                - price_to_book_score
      - name: score_value
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
