version: 2

models:
  - name: std_bd_analyst_estimate
    description: >
      Analyst Estimate (bd area), period_fact -- dự báo consensus của giới
      phân tích cho một kỳ tương lai. PK (symbol, estimate_period_end_date),
      không test unique composite (không có dbt_utils, mẫu đã dùng ở mọi
      slice trước). See
      docs/superpowers/specs/2026-08-17-intermediate-bd-do-pr-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, estimate_period_end_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: estimate_period_end_date
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: >
          Transaction time: ta biết được giá trị này từ ngày nào. Nguồn không có
          ngày công bố nên đây là run_date của lần raw ĐẦU TIÊN nhìn thấy đúng
          tập thuộc tính này. Truy vấn as-of ngày d chỉ đọc dòng known_from <= d.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time', 'assumed_filing_lag']
      - name: pit_basis
        description: >
          'observation' -- best-effort, không phải PIT thật. Backtest phải phân
          biệt được hai loại này, nếu trộn thì không ai phát hiện.
        data_tests:
          - not_null
          - accepted_values: {values: ['observation']}

  - name: std_bd_analyst_grade_action
    description: >
      Analyst Recommendation (bd area, grade-action half), event -- một
      lần thay đổi khuyến nghị của một tổ chức phân tích. PK (symbol,
      grade_date, grading_company_key). 1 trong 2 bảng vật lý tách từ concept
      vocab "Analyst Recommendation" (spec D2, cùng luật D1 slice tx) --
      /grades (1 dòng/hành động) và /grades-historical (1 dòng/tháng, phân
      bố) là 2 hình dạng không tương thích. grading_company_key là FK thật đầu
      tiên tham chiếu tới std_ip_research_firm (spec D3). See
      docs/superpowers/specs/2026-08-17-intermediate-bd-do-pr-slice-design.md §4.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, grade_date, grading_company_key, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: grade_date
        data_tests: [not_null]
      - name: grading_company_key
        description: >
          grading_company đã chuẩn hoá (upper+trim) -- đây mới là thứ khớp
          được với std_ip_research_firm. Chuỗi gốc giữ ở grading_company.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ip_research_firm')
              field: research_firm_name_key
      - name: grading_company
        data_tests: [not_null]
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}

  - name: std_bd_price_target_consensus
    description: >
      Price Target Consensus (bd area), daily_fact -- F11b (spec
      2026-08-18-intermediate-identity-spine-design.md §3) gộp
      /price-target-consensus và /price-target-summary vào một bảng vật lý
      qua full outer join theo (symbol, observation_date). Cả hai endpoint
      nguồn KHÔNG có cột date -- observation_date tổng hợp từ @run_date ở
      raw (không backfill được, lịch sử chỉ bắt đầu từ lần chạy đầu
      tiên). KHÔNG gộp vào Analyst Estimate: concept đó là period_fact,
      khoá là estimate_period_end_date (kỳ tài chính), còn price target
      không có kỳ. Field `publishers` của /price-target-summary bị bỏ
      (chuỗi JSON mảng, trái 3NF, giá trị thấp).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, observation_date, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: observation_date
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: >
          Transaction time: ta biết được giá trị này từ ngày nào. Nguồn không có
          ngày công bố nên đây là run_date của lần raw ĐẦU TIÊN nhìn thấy đúng
          tập thuộc tính này. Truy vấn as-of ngày d chỉ đọc dòng known_from <= d.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        description: >
          'observation' -- best-effort, không phải PIT thật. Backtest phải phân
          biệt được hai loại này, nếu trộn thì không ai phát hiện.
        data_tests:
          - not_null
          - accepted_values: {values: ['observation']}

  - name: std_bd_analyst_rating_distribution
    description: >
      Analyst Recommendation (bd area, rating-distribution half),
      period_fact -- ảnh chụp phân bố khuyến nghị (strong_buy..strong_sell)
      tại một ngày, nguồn /grades-historical. PK (symbol, grade_date).
      1 trong 2 bảng vật lý tách từ concept vocab "Analyst Recommendation"
      (spec D2) -- không có grading_company (nguồn không có cột này, khác
      std_bd_analyst_grade_action). See
      docs/superpowers/specs/2026-08-17-intermediate-bd-do-pr-slice-design.md §4.
      UPDATE (2026-08-20, Task 10): raw_fmp_analyst_recommendations now exists in
      Iceberg with real data (452 rows measured) -- the KNOWN BLOCKED note below
      is stale as of the staging-full-fidelity rebuild and no longer describes
      the current state. Original note (2026-08-17, spec N-23), kept for
      history: will fail to build (TrinoUserError TABLE_NOT_FOUND) until
      stg_fmp_analyst_recommendations lands in Iceberg -- source endpoint
      (/grades-historical) has availability: unknown in
      configs/sources/data_sources.yaml, one of the 5 contracts flagged in
      staging-regen-scoped memory as blocked by a fixable request-param bug
      (limit: 360 likely exceeds current FMP tier), NOT a confirmed
      paid_required restriction -- do not treat this as a bug in this
      model's SQL. Accepted limitation, live-verified 2026-08-17 (spec N-23).
      Sibling table std_bd_analyst_grade_action (same "Analyst Recommendation"
      concept, /grades endpoint) built successfully with 5,823 real rows the
      same run, confirming this is a source-availability gap, not a
      structural problem with the concept split.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, grade_date, rating_bucket, known_from]
    columns:
      - name: symbol
        description: FK to std_ar_listing.symbol.
        data_tests:
          - not_null
          - relationships:
              to: ref('std_ar_listing')
              field: symbol
      - name: grade_date
        data_tests: [not_null]
      - name: rating_bucket
        description: >
          Bậc khuyến nghị ('strong_buy'..'strong_sell'). Trước đây là 5 tên cột.
        data_tests:
          - not_null
          - accepted_values:
              values: ['strong_buy', 'buy', 'hold', 'sell', 'strong_sell']
      - name: analyst_count
        data_tests: [not_null]
      - name: source_run_date
        description: Ngày chạy raw sinh ra phiên bản này.
      - name: known_from
        description: Ngày sớm nhất một backtest được phép nhìn thấy dòng này.
        data_tests: [not_null]
      - name: known_from_basis
        description: >
          Nguồn gốc của known_from Ở TỪNG DÒNG. 'business_date' = lấy từ mốc thời
          gian nghiệp vụ (ngày SEC chấp nhận, ngày ex-dividend...). 'system_time' =
          lấy từ run_date, tức thời điểm pipeline của ta bắt được, nên nó MANG
          trọn độ trễ ingest. pit_basis là nhãn cấp bảng và không phân biệt được
          hai ca này -- mọi bản đính chính (V2+) đều là 'system_time' kể cả ở bảng
          khai pit_basis='filing'.
        data_tests:
          - accepted_values:
              values: ['business_date', 'system_time']
      - name: pit_basis
        data_tests:
          - not_null
          - accepted_values: {values: ['filing', 'observation']}
