name: market-data-lakehouse

# Rút gọn từ infra/docker-compose.yml của alpha-lakehouse-platform: chỉ giữ tầng
# lakehouse (MinIO, Postgres làm backend cho Hive Metastore, Hive Metastore, Spark,
# Trino, dbt). Đã bỏ: Airflow, Kafka, Redis, ClickHouse, API/worker/web, Keycloak,
# nginx, oauth2-proxy. Ingest và build chạy tay bằng lệnh (xem NOTES.md).

x-dbt-common: &dbt-common
  build:
    context: ./dbt
    dockerfile: Dockerfile
  image: market-data-lakehouse/dbt:local
  working_dir: /workspace/analytics/dbt
  environment:
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
    DBT_PROFILES_DIR: /workspace/analytics/dbt
    DBT_TARGET_PATH: /tmp/dbt-target
    DBT_LOG_PATH: /tmp/dbt-logs
    DBT_SCHEMA: standardize
    # Spark 3.5 trên Java 17 cần các cờ --add-opens này.
    JAVA_TOOL_OPTIONS: >-
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.net=ALL-UNNAMED
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
      --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      --add-opens=java.base/sun.nio.cs=ALL-UNNAMED
      --add-opens=java.base/sun.security.action=ALL-UNNAMED
      --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
      -Djdk.reflect.useDirectMethodHandle=false
  # rw: `dbt deps` xoá và ghi lại dbt_packages/ ngay trong project dir.
  volumes:
    - ../analytics/dbt:/workspace/analytics/dbt
  networks:
    - lakehouse-net
  entrypoint: ["dbt"]

x-dbt-common-depends: &dbt-common-depends
  hive-metastore:
    condition: service_started
  minio-init:
    condition: service_completed_successfully
  # dbt dùng method=thrift (JDBC vào spark-thriftserver:10000), không phải session nhúng.
  spark-thriftserver:
    condition: service_healthy

services:
  # ============================================
  # Storage
  # ============================================
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/$${MINIO_BUCKET} || true;
      mc anonymous set none local/$${MINIO_BUCKET};
      echo 'MinIO bucket initialized: '$${MINIO_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - lakehouse-net

  # Postgres chỉ làm backend cho Hive Metastore (init script tạo DB + role HMS).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HMS_DB_NAME: ${HMS_DB_NAME}
      HMS_DB_USER: ${HMS_DB_USER}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # Catalog + query engines
  # ============================================
  hive-metastore-init:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    image: market-data-lakehouse/hive-metastore:local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/hive/bin/schematool -dbType postgres -info ||
        /opt/hive/bin/schematool -dbType postgres -initSchema
    networks:
      - lakehouse-net

  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    image: market-data-lakehouse/hive-metastore:local
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
    ports:
      - "${HMS_PORT:-9084}:9083"
    networks:
      - lakehouse-net

  trino:
    image: trinodb/trino:481
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${TRINO_PORT:-8185}:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    networks:
      - lakehouse-net

  # ============================================
  # dbt (chạy: docker compose ... run --rm dbt <lệnh>)
  # ============================================
  dbt:
    <<: *dbt-common
    depends_on: *dbt-common-depends

  # Tự cài dbt_packages/ mỗi lần `up` (dbt_packages/ bị .gitignore).
  dbt-deps-init:
    <<: *dbt-common
    depends_on: *dbt-common-depends
    command: ["deps"]
    restart: "no"

  # Tự nạp lại các seed (ISO 4217/3166/SIC...) mỗi lần `up`, kể cả sau `down -v`.
  dbt-seed-init:
    <<: *dbt-common
    depends_on:
      <<: *dbt-common-depends
      dbt-deps-init:
        condition: service_completed_successfully
    command: ["seed"]
    restart: "no"

  # ============================================
  # Spark (standalone) + Thrift server cho dbt
  # ============================================
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: market-data-lakehouse/spark:local
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PYTHONPATH: /workspace
      RUN_MANIFEST_ROOT: /workspace/artifacts/run-manifests
    ports:
      - "${SPARK_MASTER_UI_PORT:-8182}:8080"
    volumes:
      - ../pipelines:/workspace/pipelines:ro
      - ../packages:/workspace/packages:ro
      - ../configs:/workspace/configs:ro
      - ../contracts:/workspace/contracts:ro
      - ../artifacts/run-manifests:/workspace/artifacts/run-manifests
    command: ["/opt/spark/sbin/start-master.sh"]
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g

  spark-worker-1:
    image: market-data-lakehouse/spark:local
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "6g"
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    networks:
      - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 7g

  spark-worker-2:
    image: market-data-lakehouse/spark:local
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "6g"
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    networks:
      - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 7g

  spark-thriftserver:
    image: market-data-lakehouse/spark:local
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_THRIFT_PORT:-10100}:10000"
    # wholeStage=false: whole-stage codegen làm JVM SIGSEGV khi chạy full `dbt build`.
    # cores.max=4: chừa core cho spark-submit của job ingest.
    command: ["/opt/spark/sbin/start-thriftserver.sh", "--master", "spark://spark-master:7077", "--conf", "spark.sql.codegen.wholeStage=false", "--conf", "spark.cores.max=4", "--conf", "spark.executor.memory=2g", "--conf", "spark.driver.memory=2g"]
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3g

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
