dataset: raw_fmp_insider_trading_search
layer: raw
source: fmp
source_endpoint: insider_trading_search
target_table: lakehouse.raw.raw_fmp_insider_trading_search
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `price` là giá mỗi cổ phiếu nên thuộc nhóm C decimal(18,8), KHÔNG phải nhóm A --
# giao dịch nội bộ hay có giá lẻ nhiều chữ số thập phân. `securitiesOwned`/`securitiesTransacted`
# FMP trả số nguyên không nháy nên để bigint.
grain: one row per insider transaction
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: filing_date
  source: filingDate
  type: date
  nullable: false
- name: transaction_date
  source: transactionDate
  type: date
  nullable: false
- name: reporting_cik
  source: reportingCik
  type: string
  nullable: false
- name: company_cik
  source: companyCik
  type: string
  nullable: true
- name: transaction_type
  source: transactionType
  type: string
  nullable: true
- name: securities_owned
  source: securitiesOwned
  type: bigint
  nullable: true
- name: reporting_name
  source: reportingName
  type: string
  nullable: true
- name: type_of_owner
  source: typeOfOwner
  type: string
  nullable: true
- name: acquisition_or_disposition
  source: acquisitionOrDisposition
  type: string
  nullable: true
- name: direct_or_indirect
  source: directOrIndirect
  type: string
  nullable: true
- name: form_type
  source: formType
  type: string
  nullable: true
- name: securities_transacted
  source: securitiesTransacted
  type: bigint
  nullable: true
- name: price
  source: price
  type: decimal(18,8)
  nullable: true
- name: security_name
  source: securityName
  type: string
  nullable: false
- name: url
  source: url
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- filing_date
- transaction_date
- reporting_cik
- security_name
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
