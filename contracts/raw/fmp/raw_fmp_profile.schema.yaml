# 11 cột dưới đây là field snapshot/phái sinh, thêm ở đợt staging full-fidelity
# (spec 2026-08-18-staging-full-fidelity-design.md). Chúng CỐ Ý không lên standardize:
# giá trị đúng tại thời điểm gọi API, không có cột ngày riêng, nên không dùng được cho
# chuỗi thời gian. market_cap ở đây KHÁC raw_fmp_historical_market_cap.market_cap (cái
# kia có trade_date) -- đừng dùng lẫn.
- name: average_volume
  source: averageVolume
  type: bigint
  nullable: true
- name: beta
  source: beta
  type: decimal(18,8)
  nullable: true
- name: change
  source: change
  type: decimal(18,8)
  nullable: true
- name: change_percentage
  source: changePercentage
  type: decimal(18,8)
  nullable: true
- name: exchange_full_name
  source: exchangeFullName
  type: string
  nullable: true
- name: is_actively_trading
  source: isActivelyTrading
  type: boolean
  nullable: true
- name: last_dividend
  source: lastDividend
  type: decimal(18,8)
  nullable: true
- name: market_cap
  source: marketCap
  type: decimal(28,4)
  nullable: true
- name: price
  source: price
  type: decimal(18,8)
  nullable: true
- name: range
  source: range
  type: string
  nullable: true
- name: volume
  source: volume
  type: bigint
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- cik
- isin
- cusip
- ipo_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
