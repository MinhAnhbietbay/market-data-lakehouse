dataset: raw_fmp_price_target_summary
layer: raw
source: fmp
source_endpoint: price_target_summary
target_table: lakehouse.raw.raw_fmp_price_target_summary
# F11/F11b (spec 2026-08-18): /price-target-summary không có cột `date` -- mốc thời gian
# lấy từ @run_date của landing, cùng cơ chế với raw_fmp_price_target_consensus (xem note ở
# đó cho lý do gộp ở standardize thay vì raw).
grain: one row per symbol per landing run date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: observation_date
  source: "@run_date"
  type: date
  nullable: false
- name: last_month_count
  source: lastMonthCount
  type: bigint
  nullable: true
- name: last_month_avg_price_target
  source: lastMonthAvgPriceTarget
  type: decimal(28,4)
  nullable: true
- name: last_quarter_count
  source: lastQuarterCount
  type: bigint
  nullable: true
- name: last_quarter_avg_price_target
  source: lastQuarterAvgPriceTarget
  type: decimal(28,4)
  nullable: true
- name: last_year_count
  source: lastYearCount
  type: bigint
  nullable: true
- name: last_year_avg_price_target
  source: lastYearAvgPriceTarget
  type: decimal(28,4)
  nullable: true
- name: all_time_count
  source: allTimeCount
  type: bigint
  nullable: true
- name: all_time_avg_price_target
  source: allTimeAvgPriceTarget
  type: decimal(28,4)
  nullable: true
# F11b từng bỏ field này ("chuỗi JSON chứa mảng, cấu trúc lồng, trái 3NF"). Lý do đó
# chỉ đúng cho tầng standardize; raw là kho thô nên giữ nguyên chuỗi JSON. Tầng
# standardize (std_bd_price_target_consensus) VẪN không lấy cột này.
# Spec: 2026-08-18-staging-full-fidelity-design.md §3.4.
- name: publishers
  source: publishers
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- observation_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
