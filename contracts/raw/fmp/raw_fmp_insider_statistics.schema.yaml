dataset: raw_fmp_insider_statistics
layer: raw
source: fmp
source_endpoint: insider_statistics
target_table: lakehouse.raw.raw_fmp_insider_statistics
grain: one row per symbol per fiscal quarter of insider activity
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: cik
  source: cik
  type: string
  nullable: false
- name: fiscal_year
  source: year
  type: string
  nullable: false
- name: fiscal_quarter
  source: quarter
  type: string
  nullable: false
- name: acquired_transactions
  source: acquiredTransactions
  type: integer
  nullable: true
- name: disposed_transactions
  source: disposedTransactions
  type: integer
  nullable: true
- name: total_acquired
  source: totalAcquired
  type: bigint
  nullable: true
- name: total_disposed
  source: totalDisposed
  type: bigint
  nullable: true
- name: total_purchases
  source: totalPurchases
  type: integer
  nullable: true
- name: total_sales
  source: totalSales
  type: integer
  nullable: true
- name: acquired_disposed_ratio
  source: acquiredDisposedRatio
  type: decimal(18,8)
  nullable: true
- name: average_acquired
  source: averageAcquired
  type: decimal(18,8)
  nullable: true
- name: average_disposed
  source: averageDisposed
  type: decimal(18,8)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- cik
- fiscal_year
- fiscal_quarter
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
