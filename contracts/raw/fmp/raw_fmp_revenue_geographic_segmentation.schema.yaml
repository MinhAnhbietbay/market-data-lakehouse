dataset: raw_fmp_revenue_geographic_segmentation
layer: raw
source: fmp
source_endpoint: revenue_geographic_segmentation
target_table: lakehouse.raw.raw_fmp_revenue_geographic_segmentation
grain: one row per symbol per fiscal period
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: period_end_date
  source: date
  type: date
  nullable: false
- name: fiscal_year
  source: fiscalYear
  type: string
  nullable: false
- name: period
  source: period
  type: string
  nullable: false
- name: reported_currency
  source: reportedCurrency
  type: string
  nullable: true
- name: data_americas_segment
  source: 'data.Americas Segment'
  type: decimal(28,4)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- fiscal_year
- period
- period_end_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
