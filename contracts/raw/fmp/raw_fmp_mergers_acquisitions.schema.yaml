dataset: raw_fmp_mergers_acquisitions
layer: raw
source: fmp
source_endpoint: mergers_acquisitions
target_table: lakehouse.raw.raw_fmp_mergers_acquisitions
grain: one row per announced M&A transaction
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: cik
  source: cik
  type: string
  nullable: false
- name: targeted_cik
  source: targetedCik
  type: string
  nullable: true
- name: targeted_symbol
  source: targetedSymbol
  type: string
  nullable: true
- name: announcement_date
  source: transactionDate
  type: date
  nullable: false
- name: accepted_date
  source: acceptedDate
  type: timestamp
  nullable: true
- name: filing_url
  source: link
  type: string
  nullable: true
- name: company_name
  source: companyName
  type: string
  nullable: true
- name: targeted_company_name
  source: targetedCompanyName
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- cik
- targeted_cik
- targeted_symbol
- announcement_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
- targeted_symbol may be null when the acquisition target is a private company
