dataset: raw_fmp_economic_calendar
layer: raw
source: fmp
source_endpoint: economic_calendar
target_table: lakehouse.raw.raw_fmp_economic_calendar
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `previous`/`estimate`/`actual`/`change` là giá trị chỉ báo kinh tế, biên độ cực rộng
# (GDP hàng nghìn tỉ tới lãi suất một chữ số) nên dùng decimal(28,4) theo nhóm A. Riêng
# `changePercentage` là phần trăm nên thuộc nhóm C. Cả bốn trường đầu đều null được --
# sự kiện chưa công bố thì FMP trả null, đó là trạng thái hợp lệ chứ không phải thiếu dữ liệu.
grain: one row per economic event per country per scheduled timestamp
payload:
  root: payload
  explode: true
columns:
- name: event_datetime
  source: date
  type: timestamp
  nullable: false
- name: country
  source: country
  type: string
  nullable: false
- name: event
  source: event
  type: string
  nullable: false
- name: currency
  source: currency
  type: string
  nullable: true
- name: previous_value
  source: previous
  type: decimal(28,4)
  nullable: true
- name: estimate_value
  source: estimate
  type: decimal(28,4)
  nullable: true
- name: actual_value
  source: actual
  type: decimal(28,4)
  nullable: true
- name: change_value
  source: change
  type: decimal(28,4)
  nullable: true
- name: impact
  source: impact
  type: string
  nullable: true
- name: change_percentage
  source: changePercentage
  type: decimal(18,8)
  nullable: true
- name: unit
  source: unit
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- event_datetime
- country
- event
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
