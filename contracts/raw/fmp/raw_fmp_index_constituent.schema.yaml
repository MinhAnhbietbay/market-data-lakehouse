dataset: raw_fmp_index_constituent
layer: raw
source: fmp
source_endpoint: index_constituent
target_table: lakehouse.raw.raw_fmp_index_constituent
grain: one row per index constituent change event
payload:
  root: payload
  explode: true
columns:
- name: index_symbol
  source: indexSymbol
  type: string
  nullable: false
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: change_date
  source: dateAdded
  type: date
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- index_symbol
- symbol
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
