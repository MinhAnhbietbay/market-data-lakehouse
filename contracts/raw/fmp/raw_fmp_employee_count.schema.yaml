dataset: raw_fmp_employee_count
layer: raw
source: fmp
source_endpoint: employee_count
target_table: lakehouse.raw.raw_fmp_employee_count
grain: one row per symbol per annual filing
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: cik
  source: cik
  type: string
  nullable: false
- name: acceptance_time
  source: acceptanceTime
  type: timestamp
  nullable: true
- name: period_end_date
  source: periodOfReport
  type: date
  nullable: false
- name: form_type
  source: formType
  type: string
  nullable: true
# `filing_date` maps FMP's `filingDate`: the moment the market could first know the
# employee count. `periodOfReport` (-> `period_end_date`) is the reporting period, not
# the PIT anchor -- using it as the point-in-time date would be look-ahead (spec 10.5
# rule 5).
- name: filing_date
  source: filingDate
  type: date
  nullable: true
- name: employee_count
  source: employeeCount
  type: integer
  nullable: true
- name: filing_url
  source: source
  type: string
  nullable: true
- name: company_name
  source: companyName
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- cik
- period_end_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
