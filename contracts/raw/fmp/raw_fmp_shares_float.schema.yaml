dataset: raw_fmp_shares_float
layer: raw
source: fmp
source_endpoint: shares_float
target_table: lakehouse.raw.raw_fmp_shares_float
grain: one row per symbol float snapshot/date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: observation_date
  source: date
  type: timestamp
  nullable: false
- name: float_shares
  source: floatShares
  type: bigint
  nullable: true
- name: outstanding_shares
  source: outstandingShares
  type: bigint
  nullable: true
- name: free_float
  source: freeFloat
  type: decimal(18,8)
  nullable: true
# Tên cột CỐ Ý là float_source chứ không phải source: field FMP tên `source` trùng
# thẳng với metadata column `source` mà build_raw_dataframe luôn thêm vào. Xem
# tests/unit/raw/test_metadata_column_name_collision.py.
- name: float_source
  source: source
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- observation_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
