dataset: raw_fmp_ohlcv_non_split_adjusted
layer: raw
source: fmp
source_endpoint: ohlcv_non_split_adjusted
target_table: lakehouse.raw.raw_fmp_ohlcv_non_split_adjusted
# F12 (spec 2026-08-18): endpoint tiêu đề docs là "Unadjusted Stock Price" -- đây là giá
# THÔ chưa điều chỉnh split. FMP đặt tên field trả về là adj* (adjOpen/adjHigh/adjLow/
# adjClose) một cách gây hiểu nhầm, nên cột raw đổi tên thành open/high/low/close để
# không lặp lại cái tên sai đó lên các tầng sau. `source:` giữ nguyên adjOpen/adjHigh/
# adjLow/adjClose vì đó là tên field FMP thật sự trả về, không phải lỗi gõ.
grain: one row per symbol/index per trading date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: trade_date
  source: date
  type: date
  nullable: false
- name: open
  source: adjOpen
  type: decimal(18,8)
  nullable: true
- name: high
  source: adjHigh
  type: decimal(18,8)
  nullable: true
- name: low
  source: adjLow
  type: decimal(18,8)
  nullable: true
- name: close
  source: adjClose
  type: decimal(18,8)
  nullable: true
- name: volume
  source: volume
  type: bigint
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- trade_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
