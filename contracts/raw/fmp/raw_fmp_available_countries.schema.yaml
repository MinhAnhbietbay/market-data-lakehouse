dataset: raw_fmp_available_countries
layer: raw
source: fmp
source_endpoint: available_countries
target_table: lakehouse.raw.raw_fmp_available_countries
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
grain: one row per country code
payload:
  root: payload
  explode: true
columns:
- name: country
  source: country
  type: string
  nullable: false
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- country
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
