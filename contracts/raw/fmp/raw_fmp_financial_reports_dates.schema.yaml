dataset: raw_fmp_financial_reports_dates
layer: raw
source: fmp
source_endpoint: financial_reports_dates
target_table: lakehouse.raw.raw_fmp_financial_reports_dates
grain: one row per symbol per fiscal period
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: fiscal_year
  source: fiscalYear
  type: string
  nullable: false
- name: period
  source: period
  type: string
  nullable: false
- name: link_xlsx
  source: linkXlsx
  type: string
  nullable: true
- name: link_json
  source: linkJson
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- fiscal_year
- period
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
