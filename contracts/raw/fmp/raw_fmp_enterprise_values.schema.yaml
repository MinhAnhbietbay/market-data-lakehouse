dataset: raw_fmp_enterprise_values
layer: raw
source: fmp
source_endpoint: enterprise_values
target_table: lakehouse.raw.raw_fmp_enterprise_values
grain: one row per symbol per period end date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: period_end_date
  source: date
  type: date
  nullable: false
- name: stock_price
  source: stockPrice
  type: decimal(18,8)
  nullable: true
- name: number_of_shares
  source: numberOfShares
  type: bigint
  nullable: true
- name: minus_cash_and_cash_equivalents
  source: minusCashAndCashEquivalents
  type: decimal(28,4)
  nullable: true
- name: add_total_debt
  source: addTotalDebt
  type: decimal(28,4)
  nullable: true
- name: enterprise_value
  source: enterpriseValue
  type: decimal(28,4)
  nullable: true
- name: market_capitalization
  source: marketCapitalization
  type: decimal(28,4)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- period_end_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
