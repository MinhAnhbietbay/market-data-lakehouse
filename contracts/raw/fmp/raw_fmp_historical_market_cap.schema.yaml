dataset: raw_fmp_historical_market_cap
layer: raw
source: fmp
source_endpoint: historical_market_cap
target_table: lakehouse.raw.raw_fmp_historical_market_cap
grain: one row per symbol per trading date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: '@partition_key'
  type: string
  nullable: false
- name: trade_date
  source: date
  type: date
  nullable: false
- name: market_cap
  source: marketCap
  type: decimal(28,4)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- trade_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
