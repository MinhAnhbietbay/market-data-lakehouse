dataset: raw_fmp_index_list
layer: raw
source: fmp
source_endpoint: index_list
target_table: lakehouse.raw.raw_fmp_index_list
grain: one row per market index
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: entity_name
  source: name
  type: string
  nullable: false
- name: exchange_code
  source: exchange
  type: string
  nullable: true
- name: currency_code
  source: currency
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- entity_name
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
