# Đối chiếu lại với response thật ngay khi nâng gói.
# Mọi trường số của endpoint này FMP trả về dưới dạng CHUỖI có dấu nháy
# ("soleVotingPower": "0", "amountBeneficiallyOwned": "1099168953"). Giữ nguyên string
# theo đúng tiền lệ `employees` ở /profile: ép sang số sẽ biến một giá trị lạ như "N/A"
# hoặc "1,099,168,953" thành NULL im lặng. Tầng standardize mới là chỗ ép kiểu.
