dataset: raw_fmp_all_industry_classification
layer: raw
source: fmp
source_endpoint: all_industry_classification
target_table: lakehouse.raw.raw_fmp_all_industry_classification
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `businessAddress` FMP trả về là CHUỖI chứa mảng đã stringify
# ("['BANK OF AMERICA CORPORATE CENTER', 'CHARLOTTE NC 28255']"). Staging là kho thô nên
# giữ nguyên chuỗi; tách dòng là việc của standardize.
grain: one row per symbol
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: company_name
  source: name
  type: string
  nullable: true
- name: cik
  source: cik
  type: string
  nullable: true
- name: sic_code
  source: sicCode
  type: string
  nullable: true
- name: industry_title
  source: industryTitle
  type: string
  nullable: true
- name: business_address
  source: businessAddress
  type: string
  nullable: true
- name: phone_number
  source: phoneNumber
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
