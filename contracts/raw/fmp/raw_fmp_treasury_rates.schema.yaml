payload:
  root: payload
  explode: true
columns:
- name: observation_date
  source: date
  type: date
  nullable: false
- name: month_1
  source: month1
  type: decimal(18,8)
  nullable: true
- name: month_2
  source: month2
  type: decimal(18,8)
  nullable: true
- name: month_3
  source: month3
  type: decimal(18,8)
  nullable: true
- name: month_6
  source: month6
  type: decimal(18,8)
  nullable: true
- name: year_1
  source: year1
  type: decimal(18,8)
  nullable: true
- name: year_2
  source: year2
  type: decimal(18,8)
  nullable: true
- name: year_3
  source: year3
  type: decimal(18,8)
  nullable: true
- name: year_5
  source: year5
  type: decimal(18,8)
  nullable: true
- name: year_7
  source: year7
  type: decimal(18,8)
  nullable: true
- name: year_10
  source: year10
  type: decimal(18,8)
  nullable: true
- name: year_20
  source: year20
  type: decimal(18,8)
  nullable: true
- name: year_30
  source: year30
  type: decimal(18,8)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- observation_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
