dataset: raw_fmp_grades
layer: raw
source: fmp
source_endpoint: grades
target_table: lakehouse.raw.raw_fmp_grades
grain: one row per symbol per grading action
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: grade_date
  source: date
  type: date
  nullable: false
- name: grading_company
  source: gradingCompany
  type: string
  nullable: false
- name: previous_grade
  source: previousGrade
  type: string
  nullable: true
- name: new_grade
  source: newGrade
  type: string
  nullable: true
- name: action
  source: action
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- grade_date
- grading_company
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
