dataset: raw_fmp_earnings
layer: raw
source: fmp
source_endpoint: earnings
target_table: lakehouse.raw.raw_fmp_earnings
grain: one row per symbol per earnings event
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: '@partition_key'
  type: string
  nullable: false
- name: announcement_date
  source: date
  type: date
  nullable: false
- name: eps_actual
  source: epsActual
  type: decimal(18,8)
  nullable: true
- name: eps_estimated
  source: epsEstimated
  type: decimal(18,8)
  nullable: true
- name: revenue_actual
  source: revenueActual
  type: decimal(28,4)
  nullable: true
- name: revenue_estimated
  source: revenueEstimated
  type: decimal(28,4)
  nullable: true
- name: last_updated
  source: lastUpdated
  type: date
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- announcement_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
