dataset: raw_fmp_sec_profile
layer: raw
source: fmp
source_endpoint: sec_profile
target_table: lakehouse.raw.raw_fmp_sec_profile
grain: one row per symbol SEC profile snapshot per landing run
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: cik
  source: cik
  type: string
  nullable: false
- name: registrant_name
  source: registrantName
  type: string
  nullable: true
- name: sic_code
  source: sicCode
  type: string
  nullable: true
- name: sic_description
  source: sicDescription
  type: string
  nullable: true
- name: sic_group
  source: sicGroup
  type: string
  nullable: true
- name: isin
  source: isin
  type: string
  nullable: true
- name: business_address
  source: businessAddress
  type: string
  nullable: true
- name: mailing_address
  source: mailingAddress
  type: string
  nullable: true
- name: phone_number
  source: phoneNumber
  type: string
  nullable: true
- name: postal_code
  source: postalCode
  type: string
  nullable: true
- name: city
  source: city
  type: string
  nullable: true
- name: state
  source: state
  type: string
  nullable: true
- name: country_code
  source: country
  type: string
  nullable: true
- name: description
  source: description
  type: string
  nullable: true
- name: ceo
  source: ceo
  type: string
  nullable: true
- name: website
  source: website
  type: string
  nullable: true
- name: exchange_code
  source: exchange
  type: string
  nullable: true
- name: state_location
  source: stateLocation
  type: string
  nullable: true
- name: state_of_incorporation
  source: stateOfIncorporation
  type: string
  nullable: true
- name: fiscal_year_end
  source: fiscalYearEnd
  type: string
  nullable: true
- name: ipo_date
  source: ipoDate
  type: date
  nullable: true
- name: filing_url
  source: secFilingsUrl
  type: string
  nullable: true
- name: tax_identification_number
  source: taxIdentificationNumber
  type: string
  nullable: true
- name: fifty_two_week_range
  source: fiftyTwoWeekRange
  type: string
  nullable: true
# `isActive` is a trading-status flag. Rule N3 forbids using such flags to infer listing
# status directly, so this column is marked as an unknown-role passthrough rather than a
# usable attribute (matches field_concept_map.yaml's role: unknown for this field).
- name: is_active_unknown
  source: isActive
  type: boolean
  nullable: true
- name: asset_type
  source: assetType
  type: string
  nullable: true
- name: open_figi_composite
  source: openFigiComposite
  type: string
  nullable: true
- name: price_currency
  source: priceCurrency
  type: string
  nullable: true
- name: market_sector
  source: marketSector
  type: string
  nullable: true
- name: security_type
  source: securityType
  type: string
  nullable: true
- name: is_etf
  source: isEtf
  type: boolean
  nullable: true
- name: is_adr
  source: isAdr
  type: boolean
  nullable: true
- name: is_fund
  source: isFund
  type: boolean
  nullable: true
# FMP trả "employees": "164000" -- CHUỖI, không phải số (đo thật trong api-docs.md).
# Giữ nguyên string để trung thực với payload; ép kiểu là việc của tầng trên.
- name: employees
  source: employees
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- cik
- isin
- tax_identification_number
- open_figi_composite
- ipo_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
