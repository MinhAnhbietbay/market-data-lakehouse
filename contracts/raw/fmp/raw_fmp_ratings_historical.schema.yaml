dataset: raw_fmp_ratings_historical
layer: raw
source: fmp
source_endpoint: ratings_historical
target_table: lakehouse.raw.raw_fmp_ratings_historical
grain: one row per symbol per rating date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: rating_date
  source: date
  type: date
  nullable: false
- name: rating
  source: rating
  type: string
  nullable: true
- name: overall_score
  source: overallScore
  type: integer
  nullable: true
- name: discounted_cash_flow_score
  source: discountedCashFlowScore
  type: integer
  nullable: true
- name: return_on_equity_score
  source: returnOnEquityScore
  type: integer
  nullable: true
- name: return_on_assets_score
  source: returnOnAssetsScore
  type: integer
  nullable: true
- name: debt_to_equity_score
  source: debtToEquityScore
  type: integer
  nullable: true
- name: price_to_earnings_score
  source: priceToEarningsScore
  type: integer
  nullable: true
- name: price_to_book_score
  source: priceToBookScore
  type: integer
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- rating_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
