dataset: raw_fmp_ipos_disclosure
layer: raw
source: fmp
source_endpoint: ipos_disclosure
target_table: lakehouse.raw.raw_fmp_ipos_disclosure
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
grain: one row per IPO registration filing
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: filing_date
  source: filingDate
  type: date
  nullable: false
- name: accepted_date
  source: acceptedDate
  type: date
  nullable: true
- name: effectiveness_date
  source: effectivenessDate
  type: date
  nullable: true
- name: cik
  source: cik
  type: string
  nullable: true
- name: form
  source: form
  type: string
  nullable: false
- name: url
  source: url
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- filing_date
- form
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
