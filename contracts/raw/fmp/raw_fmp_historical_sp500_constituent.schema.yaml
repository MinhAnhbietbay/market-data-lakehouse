dataset: raw_fmp_historical_sp500_constituent
layer: raw
source: fmp
source_endpoint: historical_sp500_constituent
target_table: lakehouse.raw.raw_fmp_historical_sp500_constituent
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `dateAdded` giữ kiểu string CÓ CHỦ ĐÍCH: FMP trả về dạng người đọc
# ("June 01, 2026"), không phải ISO. Khai `date` sẽ buộc Spark parse và cho NULL im lặng
# trên mọi dòng. Cột `change_date` (source `date`) mới là mốc thời gian dùng được.
grain: one row per S&P 500 constituent change event
payload:
  root: payload
  explode: true
columns:
- name: change_date
  source: date
  type: date
  nullable: false
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: date_added
  source: dateAdded
  type: string
  nullable: true
- name: added_security
  source: addedSecurity
  type: string
  nullable: true
- name: removed_ticker
  source: removedTicker
  type: string
  nullable: true
- name: removed_security
  source: removedSecurity
  type: string
  nullable: true
- name: reason
  source: reason
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- change_date
- symbol
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
