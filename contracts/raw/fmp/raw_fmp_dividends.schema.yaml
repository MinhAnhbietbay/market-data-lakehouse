dataset: raw_fmp_dividends
layer: raw
source: fmp
source_endpoint: dividends
target_table: lakehouse.raw.raw_fmp_dividends
grain: one row per dividend event
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: '@partition_key'
  type: string
  nullable: false
- name: ex_dividend_date
  source: date
  type: date
  nullable: false
- name: dividend
  source: dividend
  type: decimal(18,8)
  nullable: true
- name: record_date
  source: recordDate
  type: date
  nullable: true
- name: payment_date
  source: paymentDate
  type: date
  nullable: true
- name: declaration_date
  source: declarationDate
  type: date
  nullable: true
- name: frequency
  source: frequency
  type: string
  nullable: true
- name: adj_dividend
  source: adjDividend
  type: decimal(18,8)
  nullable: true
- name: yield
  source: yield
  type: decimal(18,8)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- ex_dividend_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
