dataset: raw_fmp_sp500_constituent
layer: raw
source: fmp
source_endpoint: sp500_constituent
target_table: lakehouse.raw.raw_fmp_sp500_constituent
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `dateFirstAdded` và `founded` giữ string CÓ CHỦ ĐÍCH: dữ liệu S&P thường chỉ có năm
# ("1971") hoặc để trống với các công ty tách ra, nên khai `date` sẽ NULL im lặng đúng những
# dòng có ít thông tin nhất. Ép kiểu là việc của standardize, nơi xử lý được phần khuyết.
grain: one row per current S&P 500 constituent
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: company_name
  source: name
  type: string
  nullable: true
- name: sector
  source: sector
  type: string
  nullable: true
- name: sub_sector
  source: subSector
  type: string
  nullable: true
- name: head_quarter
  source: headQuarter
  type: string
  nullable: true
- name: date_first_added
  source: dateFirstAdded
  type: string
  nullable: true
- name: cik
  source: cik
  type: string
  nullable: true
- name: founded
  source: founded
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
