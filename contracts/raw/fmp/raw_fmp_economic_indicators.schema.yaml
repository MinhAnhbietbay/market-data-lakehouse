dataset: raw_fmp_economic_indicators
layer: raw
source: fmp
source_endpoint: economic_indicators
target_table: lakehouse.raw.raw_fmp_economic_indicators
# F10a (spec 2026-08-18): thay cho 3 contract cũ stg_fmp_economic_{gdp,cpi,federal_funds}
# -- cả 3 endpoint FMP cũ đều gọi /economic-indicators với `name` cố định khác nhau và
# trả đúng schema {name, date, value}. Gộp thành một endpoint macro_series (12 series
# trong runtime_sets.fmp_macro_series) + một contract; thêm series mới về sau chỉ cần
# thêm 1 dòng runtime_set, không đụng contract này.
grain: one row per macro indicator observation date
payload:
  root: payload
  explode: true
columns:
- name: series_name
  source: name
  type: string
  nullable: false
- name: observation_date
  source: date
  type: date
  nullable: false
- name: observation_value
  source: value
  type: decimal(18,8)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- series_name
- observation_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
