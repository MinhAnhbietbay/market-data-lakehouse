dataset: raw_fmp_price_target_consensus
layer: raw
source: fmp
source_endpoint: price_target_consensus
target_table: lakehouse.raw.raw_fmp_price_target_consensus
# F11/F11b (spec 2026-08-18): /price-target-consensus không có cột `date` -- mốc thời
# gian lấy từ @run_date của landing (nguồn `columns:` hỗ trợ @run_date như một source đặc
# biệt, xem pipelines/raw/mapper.py::source_expression). Lịch sử chỉ bắt đầu từ lần
# chạy đầu tiên, không backfill được (vi phạm D5, chấp nhận theo quyết định người dùng).
# Concept "Price Target Consensus" (contracts/vocabulary/concepts/bd_business_direction.yaml)
# gộp bảng này với raw_fmp_price_target_summary ở TẦNG STANDARDIZE (std_bd_price_target_consensus,
# full outer join theo (symbol, observation_date)) -- raw vẫn 1 contract / 1 endpoint vì
# pipelines/raw/load_to_raw.py ghi mỗi contract vào đúng một target_table độc lập
# (write_iceberg_table không hỗ trợ hai contract khác cột cùng ghi một bảng).
grain: one row per symbol per landing run date
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: observation_date
  source: "@run_date"
  type: date
  nullable: false
- name: target_high
  source: targetHigh
  type: decimal(28,4)
  nullable: true
- name: target_low
  source: targetLow
  type: decimal(28,4)
  nullable: true
- name: target_consensus
  source: targetConsensus
  type: decimal(28,4)
  nullable: true
- name: target_median
  source: targetMedian
  type: decimal(28,4)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- observation_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
