dataset: raw_fmp_ipos_calendar
layer: raw
source: fmp
source_endpoint: ipos_calendar
target_table: lakehouse.raw.raw_fmp_ipos_calendar
# Contract dựng từ schema trong docs/superpowers/assests/api-docs.md, KHÔNG từ response đo
# thật: endpoint này còn khoá theo gói FMP (enabled: false, 402). Khoá gói chặn dữ liệu chứ
# không chặn contract -- cùng tiền lệ với raw_fmp_price_target_consensus/_summary.
# Đối chiếu lại với response thật ngay khi nâng gói.
# `priceRange` là CHUỖI khoảng giá ("10.00", có thể là "10.00-12.00"), không phải số --
# cùng lớp với `range` ở /profile. `daa` là timestamp ISO có múi giờ, tên viết tắt của FMP
# không giải nghĩa được nên giữ nguyên thay vì đặt tên đoán mò.
grain: one row per upcoming IPO
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: symbol
  type: string
  nullable: false
- name: ipo_date
  source: date
  type: date
  nullable: false
- name: daa
  source: daa
  type: timestamp
  nullable: true
- name: company_name
  source: company
  type: string
  nullable: true
- name: exchange
  source: exchange
  type: string
  nullable: true
- name: actions
  source: actions
  type: string
  nullable: true
- name: shares
  source: shares
  type: bigint
  nullable: true
- name: price_range
  source: priceRange
  type: string
  nullable: true
- name: market_cap
  source: marketCap
  type: decimal(28,4)
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- ipo_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
