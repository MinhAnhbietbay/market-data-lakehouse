dataset: raw_fmp_available_sectors
layer: raw
source: fmp
source_endpoint: available_sectors
target_table: lakehouse.raw.raw_fmp_available_sectors
grain: one row per sector
payload:
  root: payload
  explode: true
columns:
- name: sector
  source: sector
  type: string
  nullable: false
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- sector
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
