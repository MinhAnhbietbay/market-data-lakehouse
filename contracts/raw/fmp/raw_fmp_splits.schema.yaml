dataset: raw_fmp_splits
layer: raw
source: fmp
source_endpoint: splits
target_table: lakehouse.raw.raw_fmp_splits
grain: one row per split event
payload:
  root: payload
  explode: true
columns:
- name: symbol
  source: '@partition_key'
  type: string
  nullable: false
- name: split_effective_date
  source: date
  type: date
  nullable: false
- name: numerator
  source: numerator
  type: decimal(18,8)
  nullable: true
- name: denominator
  source: denominator
  type: decimal(18,8)
  nullable: true
- name: split_type
  source: splitType
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- symbol
- split_effective_date
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
