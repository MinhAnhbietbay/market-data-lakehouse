dataset: raw_openfigi_mapping
layer: raw
source: openfigi
source_endpoint: mapping
target_table: lakehouse.raw.raw_openfigi_mapping
grain: one row per input identifier per matched FIGI record
payload:
  root: payload
  explode: true
columns:
- name: input_id_type
  source: _job.idType
  type: string
  nullable: false
- name: input_id_value
  source: _job.idValue
  type: string
  nullable: false
- name: figi
  source: figi
  type: string
  nullable: true
- name: composite_figi
  source: compositeFIGI
  type: string
  nullable: true
- name: share_class_figi
  source: shareClassFIGI
  type: string
  nullable: true
- name: security_type
  source: securityType
  type: string
  nullable: true
- name: security_type_2
  source: securityType2
  type: string
  nullable: true
- name: ticker
  source: ticker
  type: string
  nullable: true
- name: exch_code
  source: exchCode
  type: string
  nullable: true
- name: name
  source: name
  type: string
  nullable: true
- name: market_sector
  source: marketSector
  type: string
  nullable: true
- name: warning
  source: warning
  type: string
  nullable: true
metadata_columns:
- name: source
  type: string
  nullable: false
- name: source_endpoint
  type: string
  nullable: false
- name: run_date
  type: date
  nullable: false
- name: partition_key
  type: string
  nullable: false
- name: requested_at
  type: timestamp
  nullable: false
- name: response_status
  type: integer
  nullable: false
- name: landing_key
  type: string
  nullable: false
- name: ingested_at
  type: timestamp
  nullable: false
primary_key:
- input_id_type
- input_id_value
- figi
- run_date
- landing_key
quality_rules:
- response_status should be 200 for rows loaded into raw
- landing_key should identify the raw landing object used to create each row
