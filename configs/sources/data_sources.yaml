runtime_sets:
  # F10/F10a/F10b (spec 2026-08-18): FRED đã gỡ hẳn -- dự án chỉ dùng một nguồn duy
  # nhất là FMP. 12 series dưới đây đều đo thật HTTP 200 trên /economic-indicators.
  # inflationRate KHÔNG có ở đây -- nó là % biến động của chính CPI, field phái sinh (R-c).
  fmp_macro_series:
    - federalFunds
    - CPI
    - GDP
    - realGDP
    - unemploymentRate
    - totalNonfarmPayroll
    - initialClaims
    - retailSales
    - smoothedUSRecessionProbabilities
    - industrialProductionTotalIndex
    - consumerSentiment
    - "30YearFixedRateMortgageAverage"
  # Seed theo configs/universes/universe.yaml. /mergers-acquisitions-search chỉ nhận
  # tên công ty, không nhận ticker -- xem F7/F7b trong spec 2026-08-18.
  universe_company_names: [Apple, Microsoft, NVIDIA, Amazon, Meta]
  # spec 2026-09-30 §2 -- dùng bởi universe_builder.
  universe_exchanges: [NASDAQ, NYSE]
