# field.md Group A7: Analyst Estimates & Ratings (Yahoo Finance, weekly snapshot)
fields:
  - {name: num_analysts_eps,          value_type: numeric_matrix, grain: symbol_daily, mart_column: num_analysts_eps,                                sign: signed, pit_semantics: observation, description: "Number of analysts providing an EPS estimate"}
  - {name: eps_estimate_cur_q,        value_type: numeric_matrix, grain: symbol_daily, mart_column: eps_estimate_cur_q,        unit: USD_per_share, dsl_unit: "CSShare:-1", sign: signed, pit_semantics: observation, description: "Consensus EPS estimate for the current quarter"}
  - {name: eps_estimate_next_q,       value_type: numeric_matrix, grain: symbol_daily, mart_column: eps_estimate_next_q,       unit: USD_per_share, dsl_unit: "CSShare:-1", sign: signed, pit_semantics: observation, description: "Consensus EPS estimate for the next quarter"}
  - {name: eps_estimate_cur_y,        value_type: numeric_matrix, grain: symbol_daily, mart_column: eps_estimate_cur_y,        unit: USD_per_share, dsl_unit: "CSShare:-1", sign: signed, pit_semantics: observation, description: "Consensus EPS estimate for the current fiscal year"}
  - {name: eps_estimate_next_y,       value_type: numeric_matrix, grain: symbol_daily, mart_column: eps_estimate_next_y,       unit: USD_per_share, dsl_unit: "CSShare:-1", sign: signed, pit_semantics: observation, description: "Consensus EPS estimate for the next fiscal year"}
  - {name: revenue_estimate_cur_q,    value_type: numeric_matrix, grain: symbol_daily, mart_column: revenue_estimate_cur_q,    unit: USD,           sign: signed, pit_semantics: observation, description: "Consensus revenue estimate for the current quarter"}
  - {name: revenue_estimate_next_q,   value_type: numeric_matrix, grain: symbol_daily, mart_column: revenue_estimate_next_q,   unit: USD,           sign: signed, pit_semantics: observation, description: "Consensus revenue estimate for the next quarter"}
  - {name: num_analysts_rating,       value_type: numeric_matrix, grain: symbol_daily, mart_column: num_analysts_rating,                             sign: signed, pit_semantics: observation, description: "Total number of analysts providing a rating"}
  - {name: rating_strong_buy,         value_type: numeric_matrix, grain: symbol_daily, mart_column: rating_strong_buy,                               sign: signed, pit_semantics: observation, description: "Number of analysts rating Strong Buy"}
  - {name: rating_buy,                value_type: numeric_matrix, grain: symbol_daily, mart_column: rating_buy,                                      sign: signed, pit_semantics: observation, description: "Number of analysts rating Buy"}
  - {name: rating_hold,               value_type: numeric_matrix, grain: symbol_daily, mart_column: rating_hold,                                     sign: signed, pit_semantics: observation, description: "Number of analysts rating Hold"}
  - {name: rating_sell,               value_type: numeric_matrix, grain: symbol_daily, mart_column: rating_sell,                                     sign: signed, pit_semantics: observation, description: "Number of analysts rating Sell"}
  - {name: rating_strong_sell,        value_type: numeric_matrix, grain: symbol_daily, mart_column: rating_strong_sell,                              sign: signed, pit_semantics: observation, description: "Number of analysts rating Strong Sell"}
  - {name: price_target_mean,         value_type: numeric_matrix, grain: symbol_daily, mart_column: price_target_mean,         unit: USD,           dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Mean analyst price target"}
  - {name: price_target_high,         value_type: numeric_matrix, grain: symbol_daily, mart_column: price_target_high,         unit: USD,           dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Highest analyst price target"}
  - {name: price_target_low,          value_type: numeric_matrix, grain: symbol_daily, mart_column: price_target_low,          unit: USD,           dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Lowest analyst price target"}
  - {name: analyst_upgrade_count,   value_type: numeric_matrix, grain: symbol_daily, mart_column: analyst_upgrade_count,   sign: signed, pit_semantics: observation, description: "Số lần nâng hạng của giới phân tích ĐÚNG ngày đó; 0 nếu không có. Dùng ts_sum(x, d) để cộng cửa sổ tuỳ ý."}
  - {name: analyst_downgrade_count, value_type: numeric_matrix, grain: symbol_daily, mart_column: analyst_downgrade_count, sign: signed, pit_semantics: observation, description: "Số lần hạ hạng ĐÚNG ngày đó; 0 nếu không có."}
  - {name: analyst_action_count,    value_type: numeric_matrix, grain: symbol_daily, mart_column: analyst_action_count,    sign: signed, pit_semantics: observation, description: "Tổng số hành động đánh giá ĐÚNG ngày đó, kể cả 'maintain' và dòng thiếu nhãn; >= upgrade + downgrade theo thiết kế."}


