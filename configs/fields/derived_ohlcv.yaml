# field.md Group B1: Derived from OHLCV. Inputs: open, high, low, close, volume, adj_close
fields:
  - {name: adj_factor,        value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_factor,        unit: ratio,  sign: signed, pit_semantics: retroactive, description: "Cumulative adjustment factor = adj_close / close, kept to replay all adjustments"}
  - {name: adj_open,          value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_open,          unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Opening price adjusted = open * adj_factor"}
  - {name: adj_high,          value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_high,          unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Session high adjusted = high * adj_factor"}
  - {name: adj_low,           value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_low,           unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Session low adjusted = low * adj_factor"}
  - {name: adj_volume,        value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_volume,        unit: shares, dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: retroactive, description: "Volume adjusted for splits only (not dividends) = volume / split_ratio"}
  - {name: returns,           value_type: numeric_matrix, grain: symbol_daily, mart_column: returns,           unit: ratio,  dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Daily return using adj_close (includes dividends) = adj_close[t]/adj_close[t-1] - 1 -- tính từ adj_close nên thừa hưởng tính hồi tố"}
  - {name: log_return,        value_type: numeric_matrix, grain: symbol_daily, mart_column: log_return,                      sign: signed, pit_semantics: observation, description: "Log return, additive over time = ln(adj_close[t]/adj_close[t-1])"}
  - {name: dollar_volume,     value_type: numeric_matrix, grain: symbol_daily, mart_column: dollar_volume,     unit: USD,    dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: observation, description: "Dollar value traded in the day = close * volume, a better liquidity proxy than raw volume"}
  - {name: adj_dollar_volume, value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_dollar_volume, unit: USD,    dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: retroactive, description: "Adjusted dollar volume = adj_close * adj_volume, more consistent over time"}
  - {name: market_cap,        value_type: numeric_matrix, grain: symbol_daily, mart_column: market_cap,       unit: USD,    dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: observation, description: "Market capitalization = close * shares_basic (giá CHƯA chuẩn hoá -- adj_close sai theo bội số split; nền shares_basic = weighted_average_shs_out bình quân gia quyền, không phải cổ phiếu lưu hành cuối kỳ, xem spec 2026-08-30 §3.4.2)"}
  - {name: cap,               value_type: numeric_matrix, grain: symbol_daily, mart_column: cap,               unit: USD_millions, dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: observation, description: "Daily market capitalization in MILLIONS (BRAIN 'cap') = market_cap / 1e6. Cùng nền shares_basic như market_cap, nên thừa hưởng nợ N-q."}
  - {name: amplitude,         value_type: numeric_matrix, grain: symbol_daily, mart_column: amplitude,        unit: ratio,  sign: signed, pit_semantics: observation, description: "Intraday range = (adj_high - adj_low) / prev_close, a measure of intraday volatility -- uses SPLIT-ADJUSTED high/low; mixing raw high/low with the adjusted prev_close would create a false jump across a split boundary (see configs/curated/field_sources.yaml)"}
  - {name: gap_pct,           value_type: numeric_matrix, grain: symbol_daily, mart_column: gap_pct,          unit: ratio,  sign: signed, pit_semantics: observation, description: "Overnight gap = (adj_open - prev_close) / prev_close -- uses SPLIT-ADJUSTED open, same reason as amplitude"}
  - {name: prev_close,        value_type: numeric_matrix, grain: symbol_daily, mart_column: prev_close,       unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Prior day's adjusted close = adj_close[t-1]"}
  - {name: adv20,             value_type: numeric_matrix, grain: symbol_daily, mart_column: adv20,             unit: shares, dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: retroactive, description: "Average daily volume in past 20 days (BRAIN) = trung bình adj_volume trên 20 ngày giao dịch, đòi đủ 20 quan sát non-null nên 19 ngày đầu mỗi mã là NULL. Nền ĐÃ điều chỉnh split, không phải volume thô."}
  - {name: sharesout,         value_type: numeric_matrix, grain: symbol_daily, mart_column: sharesout,         unit: shares_millions, dsl_unit: "CSShare:1", sign: signed, pit_semantics: observation, description: "Daily outstanding shares in MILLIONS (BRAIN). KHÔNG CÓ NGUỒN chuỗi ngày: share_count_observation là snapshot, shares_basic là bình quân gia quyền theo quý, vendor market cap chỉ phủ 63 ngày/mã."}


