# field.md Group A1: Price & Volume (Polygon.io Aggregates API, daily EOD)
fields:
  - {name: open,          value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_open,      unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Opening price, adjusted"}
  - {name: high,          value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_high,      unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Session high price, adjusted"}
  - {name: low,           value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_low,       unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Session low price, adjusted"}
  - {name: close,         value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_close,     unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Closing price, adjusted"}
  - {name: volume,        value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_volume,    unit: shares, dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: retroactive, description: "Trading volume, adjusted"}
  - {name: raw_open,      value_type: numeric_matrix, grain: symbol_daily, mart_column: open,          unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Opening price, unadjusted"}
  - {name: raw_high,      value_type: numeric_matrix, grain: symbol_daily, mart_column: high,          unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Session high price, unadjusted"}
  - {name: raw_low,       value_type: numeric_matrix, grain: symbol_daily, mart_column: low,           unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Session low price, unadjusted"}
  - {name: raw_close,     value_type: numeric_matrix, grain: symbol_daily, mart_column: close,         unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Closing price, unadjusted"}
  - {name: raw_volume,    value_type: numeric_matrix, grain: symbol_daily, mart_column: volume,        unit: shares, dsl_unit: "CSPrice:1,CSShare:1", sign: signed, pit_semantics: observation, description: "Trading volume, unadjusted"}
  - {name: typical_price, value_type: numeric_matrix, grain: symbol_daily, mart_column: typical_price, unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Typical price (pivot price) = (adj_high + adj_low + adj_close) / 3 -- cấu trúc chuẩn của phân tích kỹ thuật, đầu vào của CCI. KHÔNG phải VWAP: không có trọng số khối lượng."}
  - {name: num_trades,    value_type: numeric_matrix, grain: symbol_daily, mart_column: num_trades,                  sign: signed, pit_semantics: observation, description: "Number of transactions in the session"}
  - {name: adj_close,     value_type: numeric_matrix, grain: symbol_daily, mart_column: adj_close,     unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Closing price adjusted for splits and dividends, dựng tại curated từ std_ev_stock_split + std_ev_cash_dividend"}
  - {name: split,         value_type: numeric_matrix, grain: symbol_daily, mart_column: split,         unit: ratio,  sign: signed, pit_semantics: observation, description: "Stock split ratio (BRAIN) = numerator/denominator, 2:1 -> 2.0. CHỈ có giá trị đúng ngày sự kiện, NULL mọi ngày khác -- theo đúng tài liệu BRAIN. Đây là NGHỊCH ĐẢO của hệ số điều chỉnh giá (denominator/numerator)."}
  - {name: dividend,      value_type: numeric_matrix, grain: symbol_daily, mart_column: dividend,      unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: observation, description: "Dividend (BRAIN), USD/cổ phiếu tại ngày ex. CHỈ có giá trị đúng ngày sự kiện, NULL mọi ngày khác. Nhiều khoản cùng snap về một phiên thì cộng dồn."}
  - {name: vwap,          value_type: numeric_matrix, grain: symbol_daily, mart_column: vwap,          unit: USD,    dsl_unit: "CSPrice:1", sign: signed, pit_semantics: retroactive, description: "Daily volume weighted average price (BRAIN) = tổng giá trị giao dịch / tổng khối lượng trong phiên. KHÔNG CÓ NGUỒN: cần dữ liệu intraday. Cột tên 'vwap' của FMP là (o+h+l+c)/4, không có trọng số khối lượng -- đặt tên vwap cho nó là lặp lại lỗi adj_close của F12."}


