version: 1
table: lakehouse.raw.raw_fmp_symbol_change
layer: raw
format: iceberg
contract: contracts/raw/fmp/raw_fmp_symbol_change.schema.yaml

ownership:
  owner: data-platform

data_profile:
  primary_time_column: run_date
  entity_keys:
    - change_date
    - old_symbol
    - new_symbol
  estimated_volume: low
  query_patterns:
    - full_scan

write:
  mode: overwrite-partitions

partition_strategy:
  mode: manual
  spec:
    - transform: identity
      column: run_date

table_properties:
  format-version: "2"
